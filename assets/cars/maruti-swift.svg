  <!-- wheels -->
  <circle cx="126" cy="192" r="26" fill="#17202E"/>
  <circle cx="276" cy="192" r="26" fill="#17202E"/>
  <circle cx="126" cy="192" r="11" fill="#C8D3E3"/>
  <circle cx="276" cy="192" r="11" fill="#C8D3E3"/>
